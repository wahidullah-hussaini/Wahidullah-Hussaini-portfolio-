<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wahidullah Hussaini — Frontend Developer</title>
    <meta
      name="description"
      content="Portfolio of Wahidullah Hussaini, a frontend developer and computer education student at Kabul Education University, growing toward full-stack development."
    />
    <meta name="theme-color" content="#07080a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Theme bootstrap: runs BEFORE React paints, so the page never flashes
      the wrong theme. Dark is the default; a saved choice wins.
    -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>

    <!-- Fonts: Fraunces (display), Manrope (body), JetBrains Mono (labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
